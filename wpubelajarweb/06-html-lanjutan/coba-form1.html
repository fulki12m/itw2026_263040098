<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form</title>
</head>
<body>

    <h1>Coba Element-element Form pada html</h1>
    <h3>Masukan data diri anda dalam formulir di bawah ini:</h3>

<form>
     <label for="nama">Nama:</label>
    <input type="text" name="nama" id="nama" placeholder="Masukan Nama Lu">
   <br>
    <label for="gmail">Gmail:</label>
    <input type="email" name="gmail" id="gmail" placeholder="ucokgaming@gmail.com">
   <br>
   <label for="password">Password:</label>
   <input type="password" name="password" id="password" placeholder="Masukan Password">

   <br>
    <label for="alamat">Alamat:</label>
    <input type="text" name="alamat" id="alamat" placeholder="Masukan Alamat rumah lu">

    <br>
    <label for="gender">Jenis Kelamin:</label>
    <input type="radio" name="gender" id="gender" value="Laki-laki">Laki-laki
    <input type="radio" name="gender" id="gender" value="Perempuan">Perempuan   

    <br>

<label for="number">Nomor Telepon:</label>
<input type="tel" name="number" id="number" placeholder="Masukan Nomor Telepon">

<br> 
 
<label for="angka">Angka favorit:</label>
<input type="number" name="angka" id="angka" placeholder="Masukan angka" min="1" max="100">

<br>
<label for="tanggal">Tanggal Lahir:</label>
<input type="date" name="tanggal" id="tanggal"> 

<br>

<label for="warna">Warna Favorit:</label>
<input type="color" name="warna" id="warna">    
</form>
</body>
</html>
