<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input atribut, checkbox & radio </title>

    <h1>Contoh Input atribut, checkbox & radio </h1>

    <label for="nama">Nama :</label>
    <input type="text" name="nama" id="nama" placeholder="Masukkan nama anda" autocomplete="off" autofocus required>
    <br>    
    

<h3> Hobby:</h3>
<label for="hobby1">
<input type="checkbox" name="hobby1" id="hobby1" value="olahraga"> Olahraga
</label>

<br>
<label for="hobby2">
<input type="checkbox" name="hobby2" id="hobby2" value="membaca"> Membaca 
</label>

<br>
<label for="hobby3">
<input type="checkbox" name="hobby3" id="hobby3" value="mancing" checked> Mancing
</label>

<br>

<h3>Jenis Kelamin:</h3>
<label for="Pria">
<input type="radio" name="Jenis_Kelamin" id="Pria" value="Pria" checked> Pria
</label>

<br>
<label for="Wanita">
<input type="radio" name="Jenis_Kelamin" id="Wanita" value="Wanita"> Wanita
</label>

<br>
<button type="submit">Kirim</button>
</head>
<body>
    
</body>
</html>
